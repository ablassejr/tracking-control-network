settings.env_shell_expand = true
[env]
DCMAKE_EXPORT_COMPILE_COMMANDS = "ON"
CPP_DIR = "{{config_root}}/C++"
SIM_ROOT = "{{config_root}}"
PAPER_DIR = "{{config_root}}/../../research-vault/Research Journal/Paper"
IMAGES_DIR = "$PAPER_DIR/figures/images"

[tasks.build]
description = "Build all C++ simulation targets (Release)"
dir = "{{config_root}}/C++"
run = [
  "cmake . -B ./build -DCMAKE_BUILD_TYPE=Release",
  "make -C ./build -j$(sysctl -n hw.ncpu)",
]

[tasks.run-clean]
description = "Run nominal CSTR simulations"
depends = ["build"]
dir = "{{config_root}}/C++"
run = [
  "./build/cstr/clean/cstr_state_tracking",
  "./build/cstr/clean/cstr_control_input",
  "./build/cstr/clean/cstr_tracking_error",
]

[tasks.run-attacked]
description = "Run perturbed CSTR simulations"
depends = ["build"]
dir = "{{config_root}}/C++"
run = [
  "./build/cstr/attacked/cstr_state_tracking_attacked",
  "./build/cstr/attacked/cstr_control_input_attacked",
  "./build/cstr/attacked/cstr_tracking_error_attacked",
]

[tasks.run-defended]
description = "Run defended CSTR simulations"
depends = ["build"]
dir = "{{config_root}}/C++"
run = ["./build/cstr/defended/cstr_state_tracking_defended"]

[tasks.validate]
description = "Validate C++ output against MATLAB reference data"
depends = ["run-clean"]
dir = "{{config_root}}/C++"
run = [
  "./build/validate_matlab_cpp $SIM_ROOT/matlab/cstr/clean/cstr_state_tracking_reference.csv $SIM_ROOT/C++/cstr_state_tracking_cpp_output.csv",
]

[tasks.generate-table]
description = "Generate LaTeX runtime comparison table from logs"
depends = ["run-clean", "run-attacked", "matlab-clean", "matlab-attacked"]
run = [
  "python3 $SIM_ROOT/generate_runtime_table.py --base-dir $SIM_ROOT --output \"$PAPER_DIR/chapters/migration/runtime_comparison_table.tex\"",
]

[tasks.plot]
description = "Generate figures from C++ simulation CSV output using gnuplot"
depends = ["run-clean", "run-attacked", "run-defended"]
dir = "{{config_root}}/C++"
run = [
  "gnuplot -e \"csv='cstr_state_tracking_cpp_output.csv'; outdir='$PAPER_DIR/figures/images'\" gnuplot/cstr_state_tracking.gp",
  "gnuplot -e \"csv='cstr_state_tracking_attacked_cpp_output.csv'; outdir='$PAPER_DIR/figures/images'\" gnuplot/cstr_state_tracking_attacked.gp",
  "gnuplot -e \"csv='cstr_control_input_cpp_output.csv'; outdir='$PAPER_DIR/figures/images'\" gnuplot/cstr_control_input.gp",
  "gnuplot -e \"csv='cstr_tracking_error_cpp_output.csv'; outdir='$PAPER_DIR/figures/images'\" gnuplot/cstr_tracking_error.gp",
  "gnuplot -e \"csv_defended='cstr_state_tracking_defended_cpp_output.csv'; csv_attacked='cstr_state_tracking_attacked_cpp_output.csv'; outdir='$PAPER_DIR/figures/images'\" gnuplot/cstr_state_tracking_defended.gp",
  "gnuplot -e \"csv_state='cstr_state_tracking_cpp_output.csv'; outdir='$PAPER_DIR/figures/images'\" gnuplot/cstr_fig_clean.gp",
  "gnuplot -e \"csv_state_atk='cstr_state_tracking_attacked_cpp_output.csv'; csv_state_def='cstr_state_tracking_defended_cpp_output.csv'; outdir='$PAPER_DIR/figures/images'\" gnuplot/cstr_fig_composite.gp",
]

[tasks.matlab-clean]
description = "Run nominal CSTR MATLAB simulations"
dir = "{{config_root}}/matlab/cstr/clean"
run = [
  "matlab -batch cstr_state_tracking",
  "matlab -batch cstr_control_input",
  "matlab -batch cstr_tracking_error",
]

[tasks.matlab-attacked]
description = "Run perturbed CSTR MATLAB simulation"
dir = "{{config_root}}/matlab/cstr/attacked"
run = ["matlab -batch cstr_state_tracking_attacked"]

[tasks.all]
description = "Build, run all simulations, validate, and generate runtime table"
depends = [
  "validate",
  "generate-table",
  "plot",
  "run-defended",
]
